name: Build
# Changes that only touch documentation don't build. Tag pushes always build: GitHub doesn't
# apply path filters to tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - LICENSE
  pull_request:
    paths-ignore:
      - "**.md"
      - LICENSE
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" |
            Where-Object { $_ -match '^[^=]+=' } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build
        run: cmake --workflow Release
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path build/Release/CMakeCache.txt -Pattern '^CMAKE_PROJECT_VERSION:STATIC=(.+)$').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Error "Tag $env:GITHUB_REF_NAME doesn't match the project version $version in CMakeLists.txt."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -Last 1
          if (-not $iscc) { Write-Error "ISCC.exe not found."; exit 1 }
          & $iscc.FullName "/DAppVersion=${{ steps.version.outputs.version }}" installer/pawse.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/installer/*.exe dist/
      - uses: actions/upload-artifact@v7
        with:
          name: pawse
          path: dist/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pawse
          path: dist
      # Pawse checks this signature before it installs an update. See installer/README.md.
      - name: Sign installer
        working-directory: dist
        env:
          SIGNING_KEY: ${{ secrets.PAWSE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::error::The PAWSE_SIGNING_KEY secret isn't set."; exit 1; fi
          installer=$(ls pawse-*-x64-setup.exe)
          printf '%s  %s\n' "$(sha256sum < "$installer" | cut -d' ' -f1)" "$installer" > "$RUNNER_TEMP/signed-line.txt"
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing-key.pem")
          openssl dgst -sha256 -sign "$RUNNER_TEMP/signing-key.pem" -out "$installer.sig" "$RUNNER_TEMP/signed-line.txt"
          rm "$RUNNER_TEMP/signing-key.pem"
          openssl dgst -sha256 -verify ../installer/release-signing-key.pub.pem -signature "$installer.sig" "$RUNNER_TEMP/signed-line.txt"
      - name: Publish release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.exe *.sig --repo "$GITHUB_REPOSITORY" --title "Pawse $GITHUB_REF_NAME" --generate-notes
